name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: unit test
        run: npm run test:unit

      # Spec ↔ ソースの乖離検査
      - name: spec:check
        run: npm run spec:check

      # E2E（Playwright・合成フィクスチャのみ。実ログ不要）
      - name: install playwright browsers
        run: npx playwright install --with-deps chromium

      - name: e2e test
        run: npm run test:e2e

      # npm run report は実ログ（~/.claude）に依存するため CI では実行しない。
      # ローカルの npm run verify 専用。
